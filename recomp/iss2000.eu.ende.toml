# N64Recomp config for International Superstar Soccer 2000 (Europe) (En,De)
# Same patches as iss2000.us.rev1.toml, at this version's addresses (US name in brackets where it differs).
# Symbol file: tools/gen_syms.py baserom.eu.ende.z64 analysis/ende/overlays.tsv iss2000.eu.ende.syms.toml
# libultra_names.eu.ende.txt. The .n64 ROM is converted with tools/to_z64.py first.

[input]
entrypoint = 0x80000400
symbols_file_path = "iss2000.eu.ende.syms.toml"
rom_file_path = "../baserom.eu.ende.z64"
output_func_path = "RecompiledFuncs_ende"
functions_per_output_file = 64
recomp_include = "#include \"recomp.h\"\n#include \"iss_hooks.h\""

[patches]
# Dev-hardware probes (IS-Viewer / KMC partner board at 0xBFF00000, ROM mirror at 0x1000000).
# Retail carts take the "not present" path, which is a no-op, so stubbing them is equivalent.
stubs = [
    "func_800039C0",
    "func_80003A18",
]

# Every ROM read in the game funnels through func_80003D54 [80003894] (handle, dir, ram, rom, size).
# Tell the runtime about code overlays as they get loaded.
[[patches.hook]]
func = "func_80003D54"
before_vram = 0x80003D54
text = "iss_on_rom_read(rdram, ctx);"

# Game state 11 handler (func_80003668 [800031A4]) calls 0x801ED920 [801EFED0], where no known overlay
# has code. Most likely a leftover debug state; NOP the call until we find the overlay (see NOTES.md).
[[patches.instruction]]
func = "func_80003668"
vram = 0x80003670
value = 0x00000000

# Widescreen: widen the game's horizontal view-frustum culling (see src/iss_widescreen.cpp).
# After func_80023488 [80022E58] has stored the horizontal tan (0x8009E09C) and far-plane half-width (0x800A7824).
[[patches.hook]]
func = "func_80023488"
before_vram = 0x800235FC
text = "iss_widen_cull_frustum(rdram, ctx);"

# func_80022F00 [800228D0] recomputes the far-plane half-width and culls with it in the same function.
[[patches.hook]]
func = "func_80022F00"
before_vram = 0x8002301C
text = "iss_widen_cull_far_plane(rdram, ctx);"

# Debug: ISS_FORCE_RES=0|1 overrides the in-game Resolution option (Low/High) when it is applied.
[[patches.hook]]
func = "func_80001E40"
before_vram = 0x80001E40
text = "iss_debug_force_res(rdram, ctx);"

# Debug: ISS_SPRITE_LOG=<file>; while <file> exists, log the 2D sprite objects drawn by func_80041B50 [800414C0] (see src/iss_widescreen.cpp).
[[patches.hook]]
func = "func_80041B50"
before_vram = 0x80041B50
text = "iss_debug_sprite(rdram, ctx);"

# Widescreen: the stadium sky backdrop (drawn by func_80035CC0 [80035640] as 4:3 2D strips, called from func_80000C30 [80000D90]) is stretched to the full
# window width with RT64's extended GBI (SetRectAspect STRETCH around the call). See src/iss_widescreen.cpp.
[[patches.hook]]
func = "func_80000C30"
before_vram = 0x80000E6C
text = "iss_sky_stretch_begin(rdram, ctx);"

[[patches.hook]]
func = "func_80000C30"
before_vram = 0x80000E74
text = "iss_sky_stretch_end(rdram, ctx);"

# Debug: ISS_SWITCH_RES_AT=<seconds>:<0|1> changes the in-game Resolution option mid-session at that time,
# exactly like the Options menu handler func_80001D44 [80001D1C] does (see src/iss_widescreen.cpp).
[[patches.hook]]
func = "func_80002A10"
before_vram = 0x80002A10
text = "iss_debug_switch_res(rdram, ctx);"

# Resolution option: High mode is redirected to Low at the Options handler (see src/iss_widescreen.cpp).
[[patches.hook]]
func = "func_80001D44"
before_vram = 0x80001D44
text = "iss_resolution_option(rdram, ctx);"

# PAL: librecomp initialises osTvType (0x80000300) to NTSC before the entrypoint runs; set it to PAL first thing,
# as the console's IPL3 would, since the game picks its video mode from it (see src/iss_version.cpp).
[[patches.hook]]
func = "recomp_entrypoint"
before_vram = 0x80000400
text = "iss_set_tv_type_pal(rdram, ctx);"

# PAL picture position: func_8000164C adjusts libultra's PAL LAN1 mode for a PAL TV (and calls osViSetXScale /
# osViSetYScale), which RT64 shows squashed and garbled. Replaced: the mode gets NTSC LAN1 timings instead
# (see src/iss_version.cpp).
[[patches.hook]]
func = "func_8000164C"
before_vram = 0x8000164C
text = "iss_pal_vi_mode(rdram, ctx); return;"
