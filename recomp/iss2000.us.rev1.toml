# N64Recomp config for International Superstar Soccer 2000 (USA) (Rev 1)
# Symbol file is generated by tools/gen_syms.py from analysis/overlays.tsv + recomp/libultra_names.txt.

[input]
entrypoint = 0x80000400
symbols_file_path = "iss2000.syms.toml"
rom_file_path = "../baserom.z64"
output_func_path = "RecompiledFuncs"
functions_per_output_file = 64
recomp_include = "#include \"recomp.h\"\n#include \"iss_hooks.h\""

[patches]
# Dev-hardware probes (IS-Viewer / KMC partner board at 0xBFF00000, ROM mirror at 0x1000000).
# Retail carts take the "not present" path, which is a no-op, so stubbing them is equivalent.
stubs = [
    "func_80003500",
    "func_80003558",
]

# Every ROM read in the game funnels through func_80003894(handle, dir, ram, rom, size).
# Tell the runtime about code overlays as they get loaded.
[[patches.hook]]
func = "func_80003894"
before_vram = 0x80003894
text = "iss_on_rom_read(rdram, ctx);"

# Game state 11 handler (func_800031A4, table @ 0x8009D40C) calls 0x801EFED0, where no known overlay
# has code. Most likely a leftover debug state; NOP the call until we find the overlay (see NOTES.md).
[[patches.instruction]]
func = "func_800031A4"
vram = 0x800031AC
value = 0x00000000

# Widescreen: widen the game's horizontal view-frustum culling (see src/iss_widescreen.cpp).
# After func_80022E58 has stored the horizontal tan (0x800A0984) and far-plane half-width (0x800AA104).
[[patches.hook]]
func = "func_80022E58"
before_vram = 0x80022FCC
text = "iss_widen_cull_frustum(rdram, ctx);"

# func_800228D0 recomputes the far-plane half-width and culls with it in the same function.
[[patches.hook]]
func = "func_800228D0"
before_vram = 0x800229EC
text = "iss_widen_cull_far_plane(rdram, ctx);"

# Debug: ISS_FORCE_RES=0|1 overrides the in-game Resolution option (Low/High) when it is applied.
[[patches.hook]]
func = "func_80001E04"
before_vram = 0x80001E20
text = "iss_debug_force_res(rdram, ctx);"

# Debug: ISS_SPRITE_LOG=<file>; while <file> exists, log the 2D sprite objects drawn (see src/iss_widescreen.cpp).
[[patches.hook]]
func = "func_800414C0"
before_vram = 0x800414C0
text = "iss_debug_sprite(rdram, ctx);"

# Widescreen: the stadium sky backdrop (drawn by func_80035640 as 4:3 2D strips) is stretched to the full
# window width with RT64's extended GBI (SetRectAspect STRETCH around the call). See src/iss_widescreen.cpp.
[[patches.hook]]
func = "func_80000D90"
before_vram = 0x80000F60
text = "iss_sky_stretch_begin(rdram, ctx);"

[[patches.hook]]
func = "func_80000D90"
before_vram = 0x80000F68
text = "iss_sky_stretch_end(rdram, ctx);"

# Debug: ISS_SWITCH_RES_AT=<seconds>:<0|1> changes the in-game Resolution option mid-session at that time,
# exactly like the Options menu handler func_80001D1C does (see src/iss_widescreen.cpp).
[[patches.hook]]
func = "func_80000B28"
before_vram = 0x80000B28
text = "iss_debug_switch_res(rdram, ctx);"

# Resolution option: High mode is redirected to Low at the Options handler (see src/iss_widescreen.cpp).
[[patches.hook]]
func = "func_80001D1C"
before_vram = 0x80001D1C
text = "iss_resolution_option(rdram, ctx);"
